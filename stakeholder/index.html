  <script
    src="https://js.sentry-cdn.com/6c79989b30d4d99e63b7776b3dbf2189.min.js"
    crossorigin="anonymous"
  ></script>
  <script>
  Sentry.onLoad(function() {
    Sentry.init({
      dsn: "https://6c79989b30d4d99e63b7776b3dbf2189@o4511977154347008.ingest.us.sentry.io/4511977172369408",
      environment: "production",
      sendDefaultPii: false,
      beforeBreadcrumb: function(breadcrumb) {
        if (breadcrumb.data && breadcrumb.data.url) {
          try {
            var u = new URL(breadcrumb.data.url);
            u.search = '';
            breadcrumb.data.url = u.toString();
          } catch(e) {}
        }
        return breadcrumb;
      }
    });
  });
  </script>
